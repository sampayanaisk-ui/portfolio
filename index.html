
<!-- JESSIE MAE CONTACT MODAL -->
<style>
.jm-modal {
  width: min(92%, 480px);
  border: none;
  border-radius: 14px;
  padding: 30px;
  background: #f7f6f0;
  color: #203d37;
  box-shadow: 0 20px 70px #0004;
}

.jm-modal::backdrop {
  background: rgba(0, 0, 0, 0.65);
}

.jm-modal h2 {
  font-size: 30px;
  margin-bottom: 10px;
}

.jm-modal p {
  color: #64716b;
  font-size: 14px;
}

.jm-form {
  display: grid;
  gap: 15px;
  margin-top: 20px;
}

.jm-form label {
  font-size: 13px;
  font-weight: bold;
}

.jm-form input,
.jm-form textarea {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border: 1px solid #ccd5cc;
  border-radius: 6px;
  background: white;
  font: inherit;
}

.jm-form button {
  padding: 14px;
  border: 0;
  border-radius: 6px;
  background: #203d37;
  color: white;
  cursor: pointer;
}

.jm-form button:hover {
  background: #26745e;
}

.jm-close {
  float: right;
  border: none;
  background: transparent;
  font-size: 25px;
  cursor: pointer;
  color: #203d37;
}
</style>

<dialog id="jmContactModal" class="jm-modal"
        aria-labelledby="jmModalTitle">

  <form method="dialog">
    <button class="jm-close" aria-label="Close">×</button>
  </form>

  <h2 id="jmModalTitle">Let's Work Together</h2>

  <p>
    Tell me how I can help your business.
  </p>

  <form id="jmContactForm" class="jm-form">

    <label>
      Your Name
      <input type="text" id="jmName"
             placeholder="Enter your name" required>
    </label>

    <label>
      Email Address
      <input type="email" id="jmEmail"
             placeholder="Enter your email" required>
    </label>

    <label>
      Your Message
      <textarea id="jmMessage" rows="4"
                placeholder="How can I help you?"
                required></textarea>
    </label>

    <button type="submit">
      Continue to Email ↗
    </button>

  </form>
</dialog>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const modal = document.getElementById("jmContactModal");
  const form = document.getElementById("jmContactForm");

  document.querySelectorAll(
    '.contact-links a[href^="mailto:"]'
  ).forEach(function(link) {
    link.addEventListener("click", function(event) {
      event.preventDefault();
      modal.showModal();
    });
  });

  modal.addEventListener("click", function(event) {
    if (event.target === modal) {
      modal.close();
    }
  });

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("jmName").value;
    const email = document.getElementById("jmEmail").value;
    const message = document.getElementById("jmMessage").value;

    const subject = "Website Inquiry from " + name;
    const body =
      "Name: " + name + "\n" +
      "Email: " + email + "\n\n" +
      "Message:\n" + message;

    const mailto =
      "mailto:jessiemaegarnoza06@gmail.com" +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);

    window.location.href = mailto;
  });
});
</script>

</body>
</html>
